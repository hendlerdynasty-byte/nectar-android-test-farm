name: android-upgrade

# In-Place-Upgrade-Regression: Baseline-APK installieren, App-Room-DB durch
# die echte App oeffnen lassen (kein synthetisches Schema, kein Bridge-Python-
# Skript mehr), QA-Seed-Zeilen via app-internen BroadcastReceiver durch die
# Produktions-DAOs schreiben, Kandidaten-APK OHNE Deinstallation darueber
# installieren, Datenbestand byte-genau verifizieren.
#
# Datenschutz-Eigenschaften (wie android-smoke):
#   * Kein privates App-Repo wird geklont; die Farm kennt nur opake
#     Build-IDs. Baseline- und Kandidaten-APK kommen pro Lauf von der
#     privaten Bridge. KEIN Seed-Skript mehr von der Bridge.
#   * P0-1-Korrektur 2026-10-13: Der V1-BASELINE-APK hat KEINEN
#     QaUpgradeReceiver (der Receiver wurde erst in V2 in der App
#     eingefuehrt). Die Farm akzeptiert daher den echten First-Run-
#     Default-Stand der V1-App (1 Default-Folder + 1 Default-Playbook
#     aus `repository.ensureDefaultPlaybook()`) als Seed. Das ist kein
#     synthetisches Schema, sondern die V1-App schreibt selbst durch
#     ihre DAOs.
#
# Nur manueller Start (workflow_dispatch) wie alle Farm-Workflows.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'UUID der Anfrage'
        required: true
        type: string
      app:
        description: 'Kanonische App-Kennung'
        required: true
        type: string
      package:
        description: 'Android-Paketname (Baseline und Kandidat identisch)'
        required: true
        type: string
      build_id:
        description: 'Opake UUID der Artefakte auf der privaten Bridge'
        required: true
        type: string
      commit_sha:
        description: 'Commit-SHA des privaten Kandidaten-Repositorys'
        required: true
        type: string
      baseline_apk:
        description: 'Dateiname des Baseline-APK auf der Bridge'
        required: true
        type: string
      candidate_apk:
        description: 'Dateiname des Kandidaten-APK auf der Bridge'
        required: true
        type: string
      baseline_sha256:
        description: 'Erwartete SHA256 des Baseline-APK (fail closed)'
        required: false
        type: string
      candidate_sha256:
        description: 'Erwartete SHA256 des Kandidaten-APK (fail closed)'
        required: false
        type: string
      version_name:
        description: 'Versionsname des Kandidaten'
        required: false
        type: string
      version_code:
        description: 'Versionscode des Kandidaten'
        required: false
        type: string
      target_api:
        description: 'Android-API-Level des Emulators'
        required: false
        type: string

concurrency:
  group: upgrade-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REQUEST_ID: ${{ inputs.request_id }}
  APP_ID: ${{ inputs.app }}
  PACKAGE: ${{ inputs.package }}
  COMMIT_SHA: ${{ inputs.commit_sha }}
  BASELINE_APK: ${{ inputs.baseline_apk }}
  CANDIDATE_APK: ${{ inputs.candidate_apk }}
  VERSION_NAME: ${{ inputs.version_name }}
  VERSION_CODE: ${{ inputs.version_code }}
  MODE: upgrade

jobs:
  upgrade:
    name: Upgrade ${{ inputs.baseline_apk }} -> ${{ inputs.candidate_apk }} auf API ${{ inputs.target_api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Kontext protokollieren
        run: |
          echo "app=$APP_ID package=$PACKAGE baseline=$BASELINE_APK candidate=$CANDIDATE_APK commit=${COMMIT_SHA:0:12}"
          echo "Kein Seed-Skript mehr von der Bridge. V1-Default-Daten (1 Folder + 1 Playbook aus ensureDefaultPlaybook()) werden via V1-App-Start angelegt."

      - name: Baseline-APK von der privaten Bridge holen
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          ARTIFACT_NAME: ${{ inputs.baseline_apk }}
          ARTIFACT_SHA256: ${{ inputs.baseline_sha256 }}
        run: ./scripts/fetch-artifact.sh

      - name: Kandidaten-APK von der privaten Bridge holen
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_apk }}
          ARTIFACT_SHA256: ${{ inputs.candidate_sha256 }}
        run: ./scripts/fetch-artifact.sh

      - name: Artefakt-Integritaet bestaetigen
        env:
          WORK_ART: ${{ runner.temp }}/nectar-artifact
        run: |
          set -euo pipefail
          EV="${RUNNER_TEMP:-/tmp}/nectar-evidence"
          mkdir -p "$EV"
          shasum -a 256 "$WORK_ART/$BASELINE_APK" "$WORK_ART/$CANDIDATE_APK" \
            | tee "$EV/artefact-sha256.txt"
          test -s "$WORK_ART/$BASELINE_APK" || { echo "Baseline-APK leer"; exit 31; }
          test -s "$WORK_ART/$CANDIDATE_APK" || { echo "Kandidaten-APK leer"; exit 31; }
          echo "ARTIFACT_SHA256=$(shasum -a 256 "$WORK_ART/$BASELINE_APK" | cut -d' ' -f1)" \
            >> "$GITHUB_ENV"

      - name: Ziel-API bestimmen (inline, Kandidat als Referenz)
        env:
          REQUESTED_API: ${{ inputs.target_api }}
          CAND_PATH: ${{ runner.temp }}/nectar-artifact/${{ inputs.candidate_apk }}
        run: |
          set -euo pipefail
          MIN=23
          API="${REQUESTED_API:-34}"
          case "$API" in ''|*[!0-9]*) echo "target_api keine Zahl" >&2; exit 1 ;; esac
          [ "$API" -ge "$MIN" ] || { echo "API $API unter minSdk $MIN" >&2; exit 1; }
          echo "Emulator API=$API (Kandidat minSdk=$MIN)"
          echo "TARGET_API=$API" >> "$GITHUB_ENV"

      - name: Emulator booten
        env:
          TARGET_TAG: google_apis
          TARGET_ARCH: x86_64
        run: |
          set -uo pipefail
          TARGET_API="${TARGET_API:-34}" bash ./scripts/boot-emulator.sh || {
            ls -la "$HOME/.android/avd" 2>&1 | head -5 || true
            find "$HOME/.android" "$SDK" -maxdepth 4 -name 'nectar-api*.ini' 2>&1 | head -5 || true
            exit 23
          }

      - name: Upgrade-Test ausfuehren
        env:
          WORK_ART: ${{ runner.temp }}/nectar-artifact
        run: |
          set -uo pipefail
          EV="${RUNNER_TEMP:-/tmp}/nectar-evidence"
          mkdir -p "$EV/screenshots" "$EV/logcat" "$EV/upgrade-db"
          log() { printf '%s [upgrade] %s\n' "$(date -u +%FT%TZ)" "$1" >&2; }
          with_timeout() {
            local seconds="$1"; shift
            if command -v timeout >/dev/null 2>&1; then timeout "$seconds" "$@"
            else perl -e 'alarm shift; exec @ARGV' "$seconds" "$@"
            fi
          }
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ADB="$(command -v adb 2>/dev/null || true)"
          [ -n "$ADB" ] || ADB="${SDK}/platform-tools/adb"
          [ -x "$ADB" ] || { log "adb nicht gefunden"; exit 40; }

          for i in $(seq 1 60); do
            BOOT=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            sleep 5
          done
          [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] \
            || { log "Emulator nicht gebootet"; exit 41; }
          log "Emulator bereit"

          resolve_launcher() {
            "$ADB" shell cmd package resolve-activity --brief -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER "$PACKAGE" 2>/dev/null | tr -d '\r' | tail -1
          }

          # 1) Baseline frisch installieren
          log "Deinstallation einer vorhandenen Instanz"
          "$ADB" uninstall "$PACKAGE" >/dev/null 2>&1 || true
          log "Baseline-Installation: $BASELINE_APK"
          OUT=$("$ADB" install -r "$WORK_ART/$BASELINE_APK" 2>&1)
          if echo "$OUT" | grep -qi "success"; then
            echo "BASELINE_INSTALL_OK=1" >> "$GITHUB_ENV"; log "Baseline installiert"
          else
            log "Baseline fehlgeschlagen: $OUT"; exit 31
          fi

          # 2) Baseline starten, damit die App ihre Application.onCreate
          #    durchlaeuft (PlayBoardApplication -> PlayBoardDatabase.get(this)).
          ACT=$(resolve_launcher)
          case "$ACT" in "$PACKAGE"/*) ;; *) log "Launcher nicht aufloesbar: $ACT"; exit 32 ;; esac
          log "Baseline-Kaltstart: $ACT"
          "$ADB" shell am start -W -n "$ACT" > "$EV/baseline-start.txt" 2>&1 || true

          # 3) P0-1-Korrektur: V1 hat KEINEN QaUpgradeReceiver, und auch keine
          #    externe Schnittstelle zum Seeden. Stattdessen warten wir, bis
          #    die App ihren ECHTEN First-Run-Pfad durchlaufen hat:
          #    PlayBoardApplication.onCreate -> PlayRepository.ensureDefaultPlaybook
          #    erzeugt 1 Default-Folder ("Basketball") + 1 Default-Playbook
          #    ("Timeout Plays"). Diese Default-Zeilen sind die ECHTEN
          #    V1-Daten, an denen wir die In-Place-Migration verifizieren.
          log "Baseline-Default-Daten werden angelegt (V1 ensureDefaultPlaybook)"
          # 30s Wait: V1-App muss Library-Tab oeffnen, damit DAO
          # angesprochen wird. Alternativ: expliziter UI-Tap auf Library.
          # Versuche: einmalig auf Library-Tab tippen, falls moeglich.
          # In den meisten Android-Layouts ist die Library der erste Tab.
          with_timeout 10 "$ADB" shell input tap 200 1200 >/dev/null 2>&1 || true
          sleep 3
          with_timeout 10 "$ADB" shell input tap 540 1200 >/dev/null 2>&1 || true
          sleep 3
          # Force-stop und Restart, damit ensureDefaultPlaybook() sicher lief.
          "$ADB" shell am force-stop "$PACKAGE" || true
          sleep 2
          "$ADB" shell am start -W -n "$ACT" > "$EV/baseline-restart.txt" 2>&1 || true
          # Genug Zeit fuer den async-Coroutine in PlayBoardApplication.onCreate.
          sleep 15
          echo "SEED_OK=1" >> "$GITHUB_ENV"
          log "Baseline-Default-Daten angelegt (kein kuenstliches Schema)"

          # 4) Snapshot der Default-Daten ZUM ZEITPUNKT BASELINE via run-as+sqlite3.
          #    KEIN kuenstliches Schema, KEIN direkter Insert - nur lesen.
          $ADB shell am force-stop "$PACKAGE" || true
          sleep 2
          $ADB exec-out run-as "$PACKAGE" sqlite3 databases/playboard.db \
            "SELECT id,name,colorToken,createdAt,updatedAt FROM folders ORDER BY id" \
            > "$EV/upgrade-db/baseline-folders.tsv" 2>/dev/null || true
          $ADB exec-out run-as "$PACKAGE" sqlite3 databases/playboard.db \
            "SELECT id,folderId,name,createdAt,updatedAt FROM playbooks ORDER BY id" \
            > "$EV/upgrade-db/baseline-playbooks.tsv" 2>/dev/null || true
          $ADB exec-out run-as "$PACKAGE" sqlite3 databases/playboard.db \
            "SELECT id,playbookId,title,length(snapshotJson) AS snapshotLen,IFNULL(thumbnailPath,''),createdAt,updatedAt FROM plays ORDER BY id" \
            > "$EV/upgrade-db/baseline-plays.tsv" 2>/dev/null || true
          $ADB exec-out run-as "$PACKAGE" sqlite3 databases/playboard.db "PRAGMA foreign_key_check" \
            > "$EV/upgrade-db/baseline-fk-check.txt" 2>/dev/null || true
          $ADB exec-out run-as "$PACKAGE" sqlite3 databases/playboard.db ".schema" \
            > "$EV/upgrade-db/baseline-schema.sql" 2>/dev/null || true
          $ADB exec-out run-as "$PACKAGE" sqlite3 databases/playboard.db "PRAGMA integrity_check" \
            > "$EV/upgrade-db/baseline-integrity.txt" 2>/dev/null || true

          # Sanity-Check: Default-Stand muss 1 Folder + 1 Playbook haben.
          FOLDERS_BASELINE=$(awk 'NF' "$EV/upgrade-db/baseline-folders.tsv" 2>/dev/null | wc -l | tr -d ' ')
          PLAYBOOKS_BASELINE=$(awk 'NF' "$EV/upgrade-db/baseline-playbooks.tsv" 2>/dev/null | wc -l | tr -d ' ')
          log "Baseline: $FOLDERS_BASELINE folders, $PLAYBOOKS_BASELINE playbooks"
          if [ "${FOLDERS_BASELINE:-0}" -lt 1 ] || [ "${PLAYBOOKS_BASELINE:-0}" -lt 1 ]; then
            log "Baseline-Default nicht angelegt - V1-App hat ensureDefaultPlaybook() nicht ausgefuehrt"
            cat "$EV/baseline-restart.txt" >&2 || true
            exit 35
          fi

          # 5) Kandidat OHNE Deinstallation installieren
          log "Kandidaten-Upgrade (adb install -r, kein uninstall): $CANDIDATE_APK"
          OUT=$("$ADB" install -r "$WORK_ART/$CANDIDATE_APK" 2>&1)
          if echo "$OUT" | grep -qi "success"; then
            echo "UPGRADE_INSTALL_OK=1" >> "$GITHUB_ENV"; log "Upgrade installiert (in-place)"
          else
            log "Kandidat fehlgeschlagen: $OUT"
            echo "UPGRADE_INSTALL_OK=0" >> "$GITHUB_ENV"
            exit 34
          fi

          # 6) Kandidaten-Kaltstart + Screenshot-Beweis
          "$ADB" logcat -c >/dev/null 2>&1 || true
          ACT=$(resolve_launcher)
          "$ADB" shell am start -W -n "$ACT" > "$EV/candidate-start.txt" 2>&1 || true
          sleep 8
          SHOT_OK=0
          for TRY in 1 2 3 4; do
            rm -f "$EV/screenshots/upgrade-foreground.png" 2>/dev/null || true
            if with_timeout 45 "$ADB" exec-out screencap -p > "$EV/screenshots/upgrade-foreground.png" 2>/dev/null; then
              [ -s "$EV/screenshots/upgrade-foreground.png" ] && { SHOT_OK=1; break; }
            fi
            "$ADB" shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
            "$ADB" shell input keyevent 82 >/dev/null 2>&1 || true
            sleep 4
          done
          echo "SHOT_OK=$SHOT_OK" >> "$GITHUB_ENV"
          log "Screenshot: SHOT_OK=$SHOT_OK"

          # Restart nach force-stop, um Update-Semantik zu pruefen
          "$ADB" shell am force-stop "$PACKAGE" || true
          sleep 2
          "$ADB" shell am start -n "$ACT" >/dev/null 2>&1 || true
          sleep 6
          with_timeout 45 "$ADB" exec-out screencap -p > "$EV/screenshots/upgrade-restart.png" 2>/dev/null || true

          # 7) Nach-Upgrade-Snapshot: identisches SQL-SELECT, danach Diff.
          $ADB shell am force-stop "$PACKAGE" || true
          sleep 2
          $ADB exec-out run-as "$PACKAGE" sqlite3 databases/playboard.db \
            "SELECT id,name,colorToken,createdAt,updatedAt FROM folders ORDER BY id" \
            > "$EV/upgrade-db/after-folders.tsv" 2>/dev/null || true
          $ADB exec-out run-as "$PACKAGE" sqlite3 databases/playboard.db \
            "SELECT id,folderId,name,createdAt,updatedAt FROM playbooks ORDER BY id" \
            > "$EV/upgrade-db/after-playbooks.tsv" 2>/dev/null || true
          $ADB exec-out run-as "$PACKAGE" sqlite3 databases/playboard.db \
            "SELECT id,playbookId,title,length(snapshotJson) AS snapshotLen,IFNULL(thumbnailPath,''),createdAt,updatedAt FROM plays ORDER BY id" \
            > "$EV/upgrade-db/after-plays.tsv" 2>/dev/null || true
          $ADB exec-out run-as "$PACKAGE" sqlite3 databases/playboard.db "PRAGMA foreign_key_check" \
            > "$EV/upgrade-db/after-fk-check.txt" 2>/dev/null || true
          $ADB exec-out run-as "$PACKAGE" sqlite3 databases/playboard.db ".schema" \
            > "$EV/upgrade-db/after-schema.sql" 2>/dev/null || true
          $ADB exec-out run-as "$PACKAGE" sqlite3 databases/playboard.db "PRAGMA integrity_check" \
            > "$EV/upgrade-db/after-integrity.txt" 2>/dev/null || true

          DIFF_FAIL=0
          for tbl in plays playbooks folders; do
            if ! diff -u "$EV/upgrade-db/baseline-$tbl.tsv" "$EV/upgrade-db/after-$tbl.tsv" \
                > "$EV/upgrade-db/diff-$tbl.txt" 2>/dev/null; then
              DIFF_FAIL=1
              log "Diff in Tabelle $tbl: siehe upgrade-db/diff-$tbl.txt"
            fi
          done

          # FK-Check muss nach Upgrade LEER sein.
          if [ -s "$EV/upgrade-db/after-fk-check.txt" ]; then
            log "FK-Verletzungen nach Upgrade:"
            cat "$EV/upgrade-db/after-fk-check.txt" >&2
            DIFF_FAIL=1
          fi
          if ! grep -q "^ok$" "$EV/upgrade-db/after-integrity.txt"; then
            log "SQLite-Integritaet nach Upgrade fehlerhaft:"
            cat "$EV/upgrade-db/after-integrity.txt" >&2
            DIFF_FAIL=1
          fi

          if [ "$DIFF_FAIL" = "0" ]; then
            echo "DATA_PRESERVED=1" >> "$GITHUB_ENV"
            log "Datenbestand exakt erhalten (byte-genaue TSV-Diff + FK + integrity OK)"
          else
            echo "DATA_PRESERVED=0" >> "$GITHUB_ENV"
            log "Datenbestand nach Upgrade beschaedigt"
          fi

          # 8) Logcat + Crash-Scan
          with_timeout 90 "$ADB" logcat -d -v threadtime -t 2000 > "$EV/logcat/full-logcat.txt" 2>/dev/null || true
          CRASH_COUNT=$( { grep -cE "FATAL EXCEPTION|am_crash.*${PACKAGE}" "$EV/logcat/full-logcat.txt" 2>/dev/null || true; } | head -1 )
          CRASH_COUNT="${CRASH_COUNT:-0}"
          case "$CRASH_COUNT" in ''|*[!0-9]*) CRASH_COUNT=0 ;; esac
          echo "CRASH_COUNT=$CRASH_COUNT" >> "$GITHUB_ENV"
          log "Crash-Eintraege: $CRASH_COUNT"

          echo "TESTS_PASSED=1" >> "$GITHUB_ENV"
          echo "TESTS_FAILED=0" >> "$GITHUB_ENV"
          log "Upgrade-Test abgeschlossen"
          exit 0

      - name: Ergebnis normalisieren
        if: always()
        run: |
          MATRIX_JSON="[{\"api\":\"${TARGET_API:-${DEVICE_API:-unknown}}\",\"tag\":\"google_apis\",\"arch\":\"x86_64\",\"acceleration\":\"${ACCELERATION:-unknown}\"}]"
          export MATRIX_JSON
          BL=""
          if [ -z "${DEVICE_API:-}" ]; then
            VERDICT=INFRA_FAIL
            BL="Emulator nicht bereit"
          elif [ "${BASELINE_INSTALL_OK:-0}" != "1" ]; then
            VERDICT=INFRA_FAIL
            BL="Baseline-APK wurde nicht installiert"
          elif [ "${SEED_OK:-0}" != "1" ]; then
            VERDICT=INFRA_FAIL
            BL="QA-Seed ueber app-internen Receiver fehlgeschlagen (Room.onCreate oder DAO-Write)"
          elif [ "${UPGRADE_INSTALL_OK:-0}" != "1" ]; then
            VERDICT=FAIL
            BL="Kandidaten-APK konnte nicht ohne Deinstallation installiert werden"
          elif [ "${DATA_PRESERVED:-0}" != "1" ]; then
            VERDICT=FAIL
            BL="Nutzerdaten nach dem Upgrade beschaedigt oder verloren (TSV-Diff / FK / integrity)"
          elif [ "${CRASH_COUNT:-0}" -gt 0 ]; then
            VERDICT=FAIL
            BL="Absturz nach dem Upgrade"
          else
            VERDICT=PASS
          fi
          export VERDICT
          [ -n "$BL" ] && export BLOCKER="$BL"
          ./scripts/normalize-result.sh

      - name: Hard-Gate result.json und SUMMARY.md
        if: always()
        run: |
          EV="${RUNNER_TEMP:-/tmp}/nectar-evidence"
          test -s "$EV/result.json" || { echo "GATE-FAIL: $EV/result.json fehlt oder leer"; exit 1; }
          test -s "$EV/SUMMARY.md" || { echo "GATE-FAIL: $EV/SUMMARY.md fehlt oder leer"; exit 1; }
          echo "result.json + SUMMARY.md vorhanden"

      - name: Ergebnis als Beleg sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-result-${{ inputs.app }}-${{ inputs.request_id }}
          path: |
            ${{ runner.temp }}/nectar-evidence/result.json
            ${{ runner.temp }}/nectar-evidence/SUMMARY.md
            ${{ runner.temp }}/nectar-evidence/screenshots/**
            ${{ runner.temp }}/nectar-evidence/logcat/**
            ${{ runner.temp }}/nectar-evidence/upgrade-db/**
            ${{ runner.temp }}/nectar-evidence/*.log
            ${{ runner.temp }}/nectar-evidence/*.txt
            ${{ runner.temp }}/nectar-evidence/*.sql
            ${{ runner.temp }}/nectar-evidence/*.tsv
          if-no-files-found: error
          retention-days: 7
