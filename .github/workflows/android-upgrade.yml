name: android-upgrade

# In-Place-Upgrade-Regression: Baseline-APK installieren, Nutzerdaten
# seeden, Kandidaten-APK OHNE Deinstallation darueber installieren,
# Datenbestand verifizieren.
#
# Datenschutz-Eigenschaften (wie android-smoke):
#   * Kein privates App-Repo wird geklont; die Farm kennt nur opake
#     Build-IDs. Baseline- und Kandidaten-APK sowie das Seed-Skript
#     kommen pro Lauf von der privaten Bridge.
#   * Das Seed-Skript ist im Workflow eingebettet limitiert (reines
#     adb/sqlite3-Regex-Denylist-Veto) und nach dem Lauf vom Runner
#     geloescht.
#
# Nur manueller Start (workflow_dispatch) wie alle Farm-Workflows.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'UUID der Anfrage'
        required: true
        type: string
      app:
        description: 'Kanonische App-Kennung'
        required: true
        type: string
      package:
        description: 'Android-Paketname (Baseline und Kandidat identisch)'
        required: true
        type: string
      build_id:
        description: 'Opake UUID der Artefakte auf der privaten Bridge'
        required: true
        type: string
      commit_sha:
        description: 'Commit-SHA des privaten Kandidaten-Repositorys'
        required: true
        type: string
      baseline_apk:
        description: 'Dateiname des Baseline-APK auf der Bridge'
        required: true
        type: string
      candidate_apk:
        description: 'Dateiname des Kandidaten-APK auf der Bridge'
        required: true
        type: string
      seed_script:
        description: 'Dateiname des Seed/Verify-Skripts auf der Bridge'
        required: true
        type: string
      baseline_sha256:
        description: 'Erwartete SHA256 des Baseline-APK (fail closed)'
        required: false
        type: string
      candidate_sha256:
        description: 'Erwartete SHA256 des Kandidaten-APK (fail closed)'
        required: false
        type: string
      version_name:
        description: 'Versionsname des Kandidaten'
        required: false
        type: string
      version_code:
        description: 'Versionscode des Kandidaten'
        required: false
        type: string
      target_api:
        description: 'Android-API-Level des Emulators'
        required: false
        type: string

concurrency:
  group: upgrade-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REQUEST_ID: ${{ inputs.request_id }}
  APP_ID: ${{ inputs.app }}
  PACKAGE: ${{ inputs.package }}
  COMMIT_SHA: ${{ inputs.commit_sha }}
  BASELINE_APK: ${{ inputs.baseline_apk }}
  CANDIDATE_APK: ${{ inputs.candidate_apk }}
  SEED_SCRIPT: ${{ inputs.seed_script }}
  VERSION_NAME: ${{ inputs.version_name }}
  VERSION_CODE: ${{ inputs.version_code }}
  MODE: upgrade

jobs:
  upgrade:
    name: Upgrade ${{ inputs.baseline_apk }} -> ${{ inputs.candidate_apk }} auf API ${{ inputs.target_api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Kontext protokollieren
        run: |
          echo "app=$APP_ID package=$PACKAGE baseline=$BASELINE_APK candidate=$CANDIDATE_APK commit=${COMMIT_SHA:0:12}"
          echo "Kein Secret, keine URL und kein Artefaktinhalt wird ausgegeben."

      - name: Baseline-APK von der privaten Bridge holen
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          ARTIFACT_NAME: ${{ inputs.baseline_apk }}
          ARTIFACT_SHA256: ${{ inputs.baseline_sha256 }}
        run: ./scripts/fetch-artifact.sh

      - name: Kandidaten-APK von der privaten Bridge holen
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_apk }}
          ARTIFACT_SHA256: ${{ inputs.candidate_sha256 }}
        run: ./scripts/fetch-artifact.sh

      - name: Seed-Skript von der privaten Bridge holen (denylist-geprueft)
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          ARTIFACT_NAME: ${{ inputs.seed_script }}
        run: |
          ./scripts/fetch-artifact.sh
          SCRIPT_PATH="${RUNNER_TEMP:-/tmp}/nectar-artifact/${ARTIFACT_NAME}"
          # Fail-closed: Nur adb/sqlite3/python-stdlib-Skripte erlauben.
          if grep -En 'curl |wget |nc |ssh |(rm|chmod|chown)[[:space:]]+(-[a-zA-Z]*[[:space:]]*)*/|/etc/|/Users/|base64[[:space:]]+-d|http[s]?://' "$SCRIPT_PATH" >/dev/null 2>&1; then
            echo "ABGELEHNT: Seed-Skript enthaelt verbotene Muster"
            exit 11
          fi
          chmod 644 "$SCRIPT_PATH"

      - name: Ziel-API bestimmen
        env:
          REQUESTED_API: ${{ inputs.target_api }}
        run: ./scripts/select-target-api.sh

      - name: Emulator booten
        run: ./scripts/boot-emulator.sh

      - name: Upgrade-Test ausfuehren
        env:
          WORK_ART: ${{ runner.temp }}/nectar-artifact
        run: |
          set -uo pipefail
          EV="${RUNNER_TEMP:-/tmp}/nectar-evidence"
          mkdir -p "$EV/screenshots" "$EV/logcat" "$EV/upgrade-db"
          log() { printf '%s [upgrade] %s\n' "$(date -u +%FT%TZ)" "$1" >&2; }
          with_timeout() {
            local seconds="$1"; shift
            if command -v timeout >/dev/null 2>&1; then timeout "$seconds" "$@"
            else perl -e 'alarm shift; exec @ARGV' "$seconds" "$@"
            fi
          }
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ADB="$(command -v adb 2>/dev/null || true)"
          [ -n "$ADB" ] || ADB="${SDK}/platform-tools/adb"
          [ -x "$ADB" ] || { log "adb nicht gefunden"; exit 40; }

          for i in $(seq 1 60); do
            BOOT=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            sleep 5
          done
          [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] \
            || { log "Emulator nicht gebootet"; exit 41; }
          log "Emulator bereit"

          resolve_launcher() {
            "$ADB" shell cmd package resolve-activity --brief -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER "$PACKAGE" 2>/dev/null | tr -d '\r' | tail -1
          }

          # 1) Baseline frisch installieren
          log "Deinstallation einer vorhandenen Instanz"
          "$ADB" uninstall "$PACKAGE" >/dev/null 2>&1 || true
          log "Baseline-Installation: $BASELINE_APK"
          OUT=$("$ADB" install -r "$WORK_ART/$BASELINE_APK" 2>&1)
          if echo "$OUT" | grep -qi "success"; then
            echo "BASELINE_INSTALL_OK=1" >> "$GITHUB_ENV"; log "Baseline installiert"
          else
            log "Baseline fehlgeschlagen: $OUT"; exit 31
          fi

          # 2) Baseline starten (Room/DataStore-Dateien erzeugen), stoppen
          ACT=$(resolve_launcher)
          case "$ACT" in "$PACKAGE"/*) ;; *) log "Launcher nicht aufloesbar: $ACT"; exit 32 ;; esac
          log "Baseline-Kaltstart: $ACT"
          "$ADB" shell am start -W -n "$ACT" > "$EV/baseline-start.txt" 2>&1 || true
          sleep 8
          "$ADB" shell am force-stop "$PACKAGE" || true
          sleep 3
          log "Baseline gestoppt - Nutzerdaten werden geseedet"

          # 3) Nutzerdaten seeden (Bridge-Skript, reines adb/sqlite3)
          if ( cd "$EV" && with_timeout 300 python3 "$WORK_ART/$SEED_SCRIPT" seed ) > "$EV/seed.log" 2>&1; then
            echo "SEED_OK=1" >> "$GITHUB_ENV"; log "Seed OK"
          else
            cat "$EV/seed.log" >&2 || true
            echo "SEED_OK=0" >> "$GITHUB_ENV"
            log "Seed fehlgeschlagen"
            exit 33
          fi
          cp -a "$EV/qa-upgrade/." "$EV/upgrade-db/" 2>/dev/null || true

          # 4) Kandidat OHNE Deinstallation installieren
          log "Kandidaten-Upgrade (adb install -r, kein uninstall): $CANDIDATE_APK"
          OUT=$("$ADB" install -r "$WORK_ART/$CANDIDATE_APK" 2>&1)
          if echo "$OUT" | grep -qi "success"; then
            echo "UPGRADE_INSTALL_OK=1" >> "$GITHUB_ENV"; log "Upgrade installiert (in-place)"
          else
            log "Kandidat fehlgeschlagen: $OUT"
            echo "UPGRADE_INSTALL_OK=0" >> "$GITHUB_ENV"
            exit 34
          fi

          # 5) Kandidaten-Kaltstart + Screenshot-Beweis
          "$ADB" logcat -c >/dev/null 2>&1 || true
          ACT=$(resolve_launcher)
          "$ADB" shell am start -W -n "$ACT" > "$EV/candidate-start.txt" 2>&1 || true
          sleep 8
          SHOT_OK=0
          for TRY in 1 2 3 4; do
            rm -f "$EV/screenshots/upgrade-foreground.png" 2>/dev/null || true
            if with_timeout 45 "$ADB" exec-out screencap -p > "$EV/screenshots/upgrade-foreground.png" 2>/dev/null; then
              [ -s "$EV/screenshots/upgrade-foreground.png" ] && { SHOT_OK=1; break; }
            fi
            "$ADB" shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
            "$ADB" shell input keyevent 82 >/dev/null 2>&1 || true
            sleep 4
          done
          echo "SHOT_OK=$SHOT_OK" >> "$GITHUB_ENV"
          log "Screenshot: SHOT_OK=$SHOT_OK"

          # Resume nach force-stop - Update-Semantik ueber Restart
          "$ADB" shell am force-stop "$PACKAGE" || true
          sleep 2
          "$ADB" shell am start -n "$ACT" >/dev/null 2>&1 || true
          sleep 6
          with_timeout 45 "$ADB" exec-out screencap -p > "$EV/screenshots/upgrade-restart.png" 2>/dev/null || true

          # 6) Datenbestand verifizieren (exakte Zeilenerhaltung)
          if ( cd "$EV" && with_timeout 300 python3 "$WORK_ART/$SEED_SCRIPT" verify ) > "$EV/verify.log" 2>&1; then
            echo "DATA_PRESERVED=1" >> "$GITHUB_ENV"; log "Datenbestand exakt erhalten"
            cat "$EV/verify.log" >&2 || true
          else
            cat "$EV/verify.log" >&2 || true
            echo "DATA_PRESERVED=0" >> "$GITHUB_ENV"
            log "Datenbestand nach Upgrade beschädigt/verloren"
          fi
          cp -a "$EV/qa-upgrade/." "$EV/upgrade-db/" 2>/dev/null || true

          # 7) Logcat + Crash-Scan
          with_timeout 90 "$ADB" logcat -d -v threadtime -t 2000 > "$EV/logcat/full-logcat.txt" 2>/dev/null || true
          CRASH_COUNT=$( { grep -cE "FATAL EXCEPTION|am_crash.*${PACKAGE}" "$EV/logcat/full-logcat.txt" 2>/dev/null || true; } | head -1 )
          CRASH_COUNT="${CRASH_COUNT:-0}"
          case "$CRASH_COUNT" in ''|*[!0-9]*) CRASH_COUNT=0 ;; esac
          echo "CRASH_COUNT=$CRASH_COUNT" >> "$GITHUB_ENV"
          log "Crash-Eintraege: $CRASH_COUNT"

          echo "TESTS_PASSED=1" >> "$GITHUB_ENV"
          echo "TESTS_FAILED=0" >> "$GITHUB_ENV"
          log "Upgrade-Test abgeschlossen"
          exit 0

      - name: Ergebnis normalisieren
        if: always()
        run: |
          MATRIX_JSON="[{\"api\":\"${TARGET_API:-${DEVICE_API:-unknown}}\",\"tag\":\"google_apis\",\"arch\":\"x86_64\",\"acceleration\":\"${ACCELERATION:-unknown}\"}]"
          export MATRIX_JSON
          BL=""
          if [ -z "${DEVICE_API:-}" ]; then
            VERDICT=INFRA_FAIL
            BL="Emulator nicht bereit"
          elif [ "${BASELINE_INSTALL_OK:-0}" != "1" ]; then
            VERDICT=INFRA_FAIL
            BL="Baseline-APK wurde nicht installiert"
          elif [ "${SEED_OK:-0}" != "1" ]; then
            VERDICT=INFRA_FAIL
            BL="Nutzerdaten konnten nicht geseedet werden"
          elif [ "${UPGRADE_INSTALL_OK:-0}" != "1" ]; then
            VERDICT=FAIL
            BL="Kandidaten-APK konnte nicht ohne Deinstallation installiert werden"
          elif [ "${DATA_PRESERVED:-0}" != "1" ]; then
            VERDICT=FAIL
            BL="Nutzerdaten nach dem Upgrade beschädigt oder verloren"
          elif [ "${CRASH_COUNT:-0}" -gt 0 ]; then
            VERDICT=FAIL
            BL="Absturz nach dem Upgrade"
          else
            VERDICT=PASS
          fi
          export VERDICT
          [ -n "$BL" ] && export BLOCKER="$BL"
          ./scripts/normalize-result.sh

      - name: Ergebnis als Beleg sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-result-${{ inputs.app }}-${{ inputs.request_id }}
          path: |
            result.json
            screenshots/**
            logs/**
          if-no-files-found: ignore
          retention-days: 7
