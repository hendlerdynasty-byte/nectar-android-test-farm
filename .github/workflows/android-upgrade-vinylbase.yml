name: android-upgrade-vinylbase

# In-Place-Upgrade-Regression für VinylBase (app.vinylbase.local) — SESSION-VINYLBASE-01, v2.
#
# v2 (Director-Review #3): ECHTE UI-Assertions statt Soft-Gate.
#   1. Baseline installieren; Onboarding wird DURCH UI-TAPS ABGESCHLOSSEN
#      (btn_skip via resource-id; onboarding_done wird dadurch von der App
#      selbst gesetzt — kein synthetischer Prefs-Write).
#   2. Drei eigene Datensätze über die echte Add-Dialog-UI anlegen
#      (fab -> et_artist/et_album -> "Hinzufügen"), einer davon NACH dem
#      Anlegen über Langdruck -> "Bearbeiten" GEÄNDERT.
#   3. Prefs-Snapshot via adb root (nur lesen): 3 Demo- + 3 Nutzer-Records,
#      der geänderte Künstlerwert muss im Persistenzstring stehen.
#   4. Export-Inhaltsprobe: btn_export_csv -> Share-Sheet nur dismiss (BACK);
#      die Cache-Datei cache/exports/vinylbase_sammlung.csv wird via root
#      gelesen und gegen die erwarteten Inhalte geprüft (echter Export-
#      Content-Beweis ohne Share-Ziel-Abhängigkeit).
#   5. Import: CSV nach /sdcard/Download pushen, btn_import_csv -> SAF-
#      DocumentsUI (Filename-Tap) -> Import-Record-Assertion.
#   6. Kandidat OHNE Deinstallation drüber; Kaltstart.
#   7. Post-Upgrade-Assertions (HARTE Gates):
#      - Onboarding darf NICHT erscheinen (onboarding_done überlebt Upgrade)
#      - alle 6 Datensätze in der Liste gerendert (Demo 3 + Nutzer 3)
#      - Suche: "TestAlbumZwei" eingeben -> zugehöriger Künstler sichtbar,
#        andere Records gefiltert
#      - geänderter Wert "TestKuenstler1EDITIERT" weiterhin sichtbar
#      - Kaltstart erneut -> Daten weiterhin da
#      - Prefs-IDs byte-genau erhalten, Crash-Scan 0
#
# Datenschutz-Eigenschaften: die Farm klont niemals Quellcode; nur opake
# Build-IDs; kein Seed-Skript, kein synthetischer Prefs-Write — alle Daten
# entstehen durch die App selbst über ihre Produktions-UI/DAOs.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'UUID der Anfrage'
        required: true
        type: string
      app:
        description: 'Kanonische App-Kennung (z. B. vinylbase-s1)'
        required: true
        type: string
      package:
        description: 'Android-Paketname (app.vinylbase.local)'
        required: true
        type: string
      build_id:
        description: 'Opake UUID der Artefakte auf der privaten Bridge'
        required: true
        type: string
      commit_sha:
        description: 'Commit-SHA des Kandidaten-Repositorys'
        required: true
        type: string
      baseline_apk:
        description: 'Dateiname des Baseline-APK auf der Bridge'
        required: true
        type: string
      candidate_apk:
        description: 'Dateiname des Kandidaten-APK auf der Bridge'
        required: true
        type: string
      baseline_sha256:
        description: 'Erwartete SHA256 des Baseline-APK (fail closed)'
        required: false
        type: string
      candidate_sha256:
        description: 'Erwartete SHA256 des Kandidaten-APK (fail closed)'
        required: false
        type: string
      version_name:
        description: 'Versionsname des Kandidaten'
        required: false
        type: string
      version_code:
        description: 'Versionscode des Kandidaten'
        required: false
        type: string
      target_api:
        description: 'Android-API-Level des Emulators'
        required: false
        type: string

concurrency:
  group: upgrade-vinylbase-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REQUEST_ID: ${{ inputs.request_id }}
  APP_ID: ${{ inputs.app }}
  PACKAGE: ${{ inputs.package }}
  COMMIT_SHA: ${{ inputs.commit_sha }}
  BASELINE_APK: ${{ inputs.baseline_apk }}
  CANDIDATE_APK: ${{ inputs.candidate_apk }}
  VERSION_NAME: ${{ inputs.version_name }}
  VERSION_CODE: ${{ inputs.version_code }}
  MODE: upgrade-vinylbase

jobs:
  upgrade-vinylbase:
    name: "Upgrade mit UI-Assertions: ${{ inputs.baseline_apk }} -> ${{ inputs.candidate_apk }} (API ${{ inputs.target_api }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Baseline-APK von der privaten Bridge holen
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          ARTIFACT_NAME: ${{ inputs.baseline_apk }}
          ARTIFACT_SHA256: ${{ inputs.baseline_sha256 }}
        run: ./scripts/fetch-artifact.sh

      - name: Kandidaten-APK von der privaten Bridge holen
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_apk }}
          ARTIFACT_SHA256: ${{ inputs.candidate_sha256 }}
        run: ./scripts/fetch-artifact.sh

      - name: Artefakt-Integritaet bestaetigen
        env:
          WORK_ART: ${{ runner.temp }}/nectar-artifact
        run: |
          set -euo pipefail
          EV="${RUNNER_TEMP:-/tmp}/nectar-evidence"
          mkdir -p "$EV"
          shasum -a 256 "$WORK_ART/$BASELINE_APK" "$WORK_ART/$CANDIDATE_APK" | tee "$EV/artefact-sha256.txt"
          test -s "$WORK_ART/$BASELINE_APK" || { echo "Baseline-APK leer"; exit 31; }
          test -s "$WORK_ART/$CANDIDATE_APK" || { echo "Kandidaten-APK leer"; exit 31; }

      - name: Ziel-API bestimmen
        env:
          REQUESTED_API: ${{ inputs.target_api }}
        run: |
          set -euo pipefail
          MIN=26
          API="${REQUESTED_API:-34}"
          case "$API" in ''|*[!0-9]*) echo "target_api keine Zahl" >&2; exit 1 ;; esac
          [ "$API" -ge "$MIN" ] || { echo "API $API unter minSdk $MIN" >&2; exit 1; }
          echo "Emulator API=$API (VinylBase minSdk=$MIN)"
          echo "TARGET_API=$API" >> "$GITHUB_ENV"

      - name: Emulator booten
        env:
          TARGET_TAG: google_apis
          TARGET_ARCH: x86_64
        run: |
          set -uo pipefail
          TARGET_API="${TARGET_API:-34}" bash ./scripts/boot-emulator.sh || {
            ls -la "$HOME/.android/avd" 2>&1 | head -5 || true
            exit 23
          }

      - name: Upgrade-Test mit UI-Assertions
        env:
          WORK_ART: ${{ runner.temp }}/nectar-artifact
        run: |
          set -uo pipefail
          EV="${RUNNER_TEMP:-/tmp}/nectar-evidence"
          mkdir -p "$EV/screenshots" "$EV/logcat" "$EV/upgrade-prefs" "$EV/ui-dumps"
          log() { printf '%s [upgrade-v2] %s\n' "$(date -u +%FT%TZ)" "$1" >&2; }
          with_timeout() {
            local seconds="$1"; shift
            if command -v timeout >/dev/null 2>&1; then timeout "$seconds" "$@"
            else perl -e 'alarm shift; exec @ARGV' "$seconds" "$@"
            fi
          }
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ADB="$(command -v adb 2>/dev/null || true)"
          [ -n "$ADB" ] || ADB="${SDK}/platform-tools/adb"
          [ -x "$ADB" ] || { log "adb nicht gefunden"; exit 40; }

          # Release-APKs sind nicht debuggable -> adb root (nur-lesen auf App-Daten)
          "$ADB" root >/dev/null 2>&1 || true
          sleep 3
          "$ADB" wait-for-device >/dev/null 2>&1 || true
          for i in $(seq 1 60); do
            BOOT=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            sleep 5
          done
          [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] \
            || { log "Emulator nicht gebootet"; exit 41; }
          # Screen aufwecken + Keyguard wegziehen (Emulator ohne PIN);
          # ohne dieses findet uiautomator nur den Lockscreen.
          "$ADB" shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
          sleep 2
          "$ADB" shell input keyevent 82 >/dev/null 2>&1 || true  # MENU = keyguard dismiss
          sleep 1
          "$ADB" shell wm dismiss-keyguard >/dev/null 2>&1 || true
          sleep 1
          "$ADB" shell settings put global stay_on_while_plugged_in 3 >/dev/null 2>&1 || true
          # Boot-Settle: Emulator-System unter Last direkt nach dem Boot
          # anfällig für "Process system isn't responding"-ANR-Dialoge
          # (beobachtet in Run 38472939837, Dumps 3-13).
          log "Warte 45s Boot-Settle..."
          sleep 45
          dismiss_anr() {
            local c
            c=$(grep -oE 'text="Wait"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' "$EV/ui-dumps/uidump-$UIDUMP_N.xml" 2>/dev/null | head -1 | sed -E 's/.*\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\].*/\1 \2 \3 \4/')
            [ -n "$c" ] || return 1
            set -- $c
            "$ADB" shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 )) >/dev/null 2>&1
            log "ANR-Dialog 'Wait' getippt"
            sleep 5
            return 0
          }
          log "Emulator bereit (Screen wach, Keyguard dismissed, Settle ok)"

          # ---------- UI-Automation-Helfer (resource-id-basiert, mit Retry) ----------
          # uiautomator resource-ids sind mit der applicationId des
          # INSTALLIERTEN APK namespaced (app.vinylbase.local), nicht mit dem
          # Kotlin-R-Class-Namespace — belegt in Run 38477427959, Dump 13:
          # resource-id="app.vinylbase.local:id/btn_skip".
          PKG_RES="$PACKAGE"
          UIDUMP_N=0
          # Dumps sind auf dem Software-Emulator teuer (Run 38489669387:
          # System-ANR-Loop unter Dump-Last). --compressed = kleinerer Baum;
          # Pausen zwischen Versuchen größer; WAKE nur im Fehlerfall.
          dump_ui() {
            local d
            for d in 1 2 3; do
              UIDUMP_N=$((UIDUMP_N+1))
              with_timeout 45 "$ADB" shell uiautomator dump --compressed /sdcard/uidump.xml >/dev/null 2>&1 || true
              "$ADB" shell cat /sdcard/uidump.xml > "$EV/ui-dumps/uidump-$UIDUMP_N.xml" 2>/dev/null || true
              if [ -s "$EV/ui-dumps/uidump-$UIDUMP_N.xml" ]; then
                if grep -q "isn't responding" "$EV/ui-dumps/uidump-$UIDUMP_N.xml" 2>/dev/null; then
                  dismiss_anr || true
                  sleep 8
                  continue
                fi
                sleep 2
                return 0
              fi
              "$ADB" shell input keyevent KEYCODE_WAKEUP >/dev/null 2>&1 || true
              sleep 8
            done
            with_timeout 20 "$ADB" exec-out screencap -p > "$EV/screenshots/dump-failed-$UIDUMP_N.png" 2>/dev/null || true
            return 1
          }
          find_bounds() {
            local key="$1" raw coords x1 y1 x2 y2
            [ -s "$EV/ui-dumps/uidump-$UIDUMP_N.xml" ] || return 1
            raw=$(grep -oE "(resource-id=\"$PKG_RES:id/$key\"|text=\"$key\")[^>]*bounds=\"\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]\"" \
                    "$EV/ui-dumps/uidump-$UIDUMP_N.xml" 2>/dev/null | head -1)
            [ -n "$raw" ] || return 1
            coords=$(printf '%s' "$raw" | sed -E 's/.*bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]".*/\1 \2 \3 \4/')
            set -- $coords
            x1=$1; y1=$2; x2=$3; y2=$4
            [ "$x2" -gt "$x1" ] && [ "$y2" -gt "$y1" ] || return 1
            echo "$(( (x1 + x2) / 2 )) $(( (y1 + y2) / 2 ))"
          }
          tap_ui() {
            local key="$1" tries="${2:-4}" c t
            for t in $(seq 1 "$tries"); do
              dump_ui && c=$(find_bounds "$key") && [ -n "$c" ] && {
                "$ADB" shell input tap $c >/dev/null 2>&1
                log "tap $key -> $c (Try $t)"
                sleep 3
                return 0
              }
              sleep 6
            done
            log "NICHT GEFUNDEN: $key"
            return 1
          }
          type_into() {
            local key="$1" text="$2"
            tap_ui "$key" 5 || return 1
            sleep 1
            "$ADB" shell input text "$text" >/dev/null 2>&1
            sleep 1
            # IME schließen: BACK schließt bei offenem IME nur die Tastatur,
            # NICHT den Dialog (ESC/111 schließt den ganzen AlertDialog —
            # Run 38486109193, Dumps 13+: Dialog weg, Liste sichtbar).
            "$ADB" shell input keyevent 4 >/dev/null 2>&1 || true
            sleep 1
            return 0
          }
          # Dialog scrollen (Positive-Button liegt auf kleinen Screens unter-
          # halb des Viewports; Dialog hat 10 Felder).
          scroll_dialog() {
            "$ADB" shell input swipe 160 480 160 200 400 >/dev/null 2>&1 || true
            sleep 1
          }
          ui_contains() {
            grep -q -- "$1" "$EV/ui-dumps/uidump-$UIDUMP_N.xml" 2>/dev/null
          }
          resolve_launcher() {
            "$ADB" shell cmd package resolve-activity --brief -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER "$PACKAGE" 2>/dev/null | tr -d '\r' | tail -1
          }
          cold_start() {
            "$ADB" shell am force-stop "$PACKAGE" || true
            sleep 2
            "$ADB" shell am start -W -n "$(resolve_launcher)" > "$EV/start-$1.txt" 2>&1 || true
            sleep 6
          }
          read_prefs() {
            "$ADB" exec-out cat "/data/data/$PACKAGE/shared_prefs/vinylbase_prefs.xml" > "$1" 2>/dev/null
            grep -q "records_json" "$1"
          }
          longpress_record() {
            local c
            dump_ui || return 1
            c=$(find_bounds "$1") || return 1
            [ -n "$c" ] || return 1
            set -- $c
            "$ADB" shell input swipe "$1" "$2" "$1" "$2" 1400 >/dev/null 2>&1
            sleep 2
            return 0
          }

          # ================= 1) BASELINE INSTALLIEREN + EINRICHTEN =================
          "$ADB" uninstall "$PACKAGE" >/dev/null 2>&1 || true
          log "Baseline-Installation: $BASELINE_APK"
          OUT=$("$ADB" install -r "$WORK_ART/$BASELINE_APK" 2>&1)
          echo "$OUT" | grep -qi "success" || { log "Baseline fehlgeschlagen: $OUT"; exit 31; }
          log "Baseline installiert"
          echo "BASELINE_INSTALL_OK=1" >> "$GITHUB_ENV"

          ACT=$(resolve_launcher)
          case "$ACT" in "$PACKAGE"/*) ;; *) log "Launcher nicht auflösbar: $ACT"; exit 32 ;; esac
          "$ADB" shell am start -W -n "$ACT" > "$EV/baseline-start.txt" 2>&1 || true
          sleep 8

          # ---------- 2) ONBOARDING DURCH UI ABSCHLIESSEN (harte Pflicht) ----------
          if tap_ui "btn_skip" 6; then
            log "Onboarding per UI abgeschlossen (btn_skip -> onboarding_done durch App)"
            sleep 4
          else
            DUMP_OK=0
            for dtry in 1 2 3 4; do
              if dump_ui; then
                if ui_contains "recycler"; then
                  log "Kein Onboarding (bereits eingerichtet) — fortfahren"
                  DUMP_OK=1; break
                fi
                # Eventuell war der Screen gerade im Wechsel: nochmal versuchen
                sleep 5
              else
                sleep 5
              fi
            done
            [ "$DUMP_OK" = "1" ] || { log "UI-Status nach Start nicht ermittelbar (Onboarding-UI nicht gefunden, Liste nicht sichtbar)"; exit 33; }
          fi
          echo "SEED_OK=1" >> "$GITHUB_ENV"

          # ---------- 3) DREI NUTZER-DATENSÄTZE ÜBER DIE UI ANLEGEN ----------
          add_record() {
            tap_ui "fab" 6 || return 1
            sleep 2
            type_into "et_artist" "$1" || return 1
            type_into "et_album" "$2" || return 1
            # Positive-Button finden; ggf. vorher im Dialog scrollen (bis zu 4x)
            local found=0 s
            for s in 1 2 3 4 5; do
              if tap_ui "Hinzufügen" 2; then found=1; break; fi
              scroll_dialog
            done
            [ "$found" = "1" ] || { log "Hinzufügen-Button nicht erreichbar"; return 1; }
            sleep 3
            dump_ui || return 1
            ui_contains "$2" || { log "Record $2 nach Anlegen nicht in Liste"; return 1; }
            return 0
          }
          add_record "TestKuenstler1" "TestAlbumEins" || { log "Anlegen Record 1 fehlgeschlagen"; exit 50; }
          log "Record 1 angelegt"
          add_record "TestKuenstler2" "TestAlbumZwei" || { log "Anlegen Record 2 fehlgeschlagen"; exit 50; }
          log "Record 2 angelegt"
          add_record "TestKuenstler3" "TestAlbumDrei" || { log "Anlegen Record 3 fehlgeschlagen"; exit 50; }
          log "Record 3 angelegt"

          # ---------- 4) RECORD 1 ÜBER DIE UI BEARBEITEN ----------
          longpress_record "TestAlbumEins" || { log "Langdruck auf Record 1 fehlgeschlagen"; exit 51; }
          tap_ui "Bearbeiten" 6 || { log "Bearbeiten-Option nicht gefunden"; exit 51; }
          sleep 2
          tap_ui "et_artist" 6 || { log "et_artist im Bearbeiten-Dialog nicht gefunden"; exit 51; }
          for k in $(seq 1 13); do "$ADB" shell input keyevent 67 >/dev/null 2>&1; done
          "$ADB" shell input text "TestKuenstler1EDITIERT" >/dev/null 2>&1
          "$ADB" shell input keyevent 4 >/dev/null 2>&1  # IME zu (BACK)
          sleep 1
          EFOUND=0
          for s in 1 2 3 4 5; do
            if tap_ui "Hinzufügen" 2; then EFOUND=1; break; fi
            scroll_dialog
          done
          [ "$EFOUND" = "1" ] || { log "Speichern (Hinzufügen) im Bearbeiten-Dialog nicht gefunden"; exit 51; }
          sleep 3
          dump_ui || { log "Dump nach Bearbeitung fehlgeschlagen"; exit 51; }
          ui_contains "TestKuenstler1EDITIERT" || { log "Geänderter Wert nicht in Liste"; exit 51; }
          log "Record 1 bearbeitet -> TestKuenstler1EDITIERT (UI bestätigt)"

          # ---------- 5) BASELINE-PREFS-SNAPSHOT (nur lesen) ----------
          "$ADB" shell am force-stop "$PACKAGE" || true
          sleep 2
          read_prefs "$EV/upgrade-prefs/baseline-prefs.xml" \
            || { log "Baseline-Prefs nicht lesbar"; exit 35; }
          grep -q "TestKuenstler1EDITIERT" "$EV/upgrade-prefs/baseline-prefs.xml" \
            || { log "Geänderter Wert fehlt im Persistenzstring"; exit 35; }
          grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
            "$EV/upgrade-prefs/baseline-prefs.xml" | sort > "$EV/upgrade-prefs/baseline-ids.txt"
          IDS_BASELINE=$(wc -l < "$EV/upgrade-prefs/baseline-ids.txt" | tr -d ' ')
          log "Baseline-IDs: $IDS_BASELINE (6 erwartet: 3 Demo + 3 Nutzer)"
          [ "$IDS_BASELINE" -ge 6 ] || { log "Zu wenige Records vor Upgrade"; exit 35; }

          # ---------- 6) EXPORT-INHALTSPROBE (echter CSV-Content) ----------
          tap_ui "btn_export_csv" 5 || { log "Export-Button nicht gefunden"; exit 52; }
          sleep 4
          "$ADB" shell input keyevent 4 >/dev/null 2>&1
          sleep 2
          "$ADB" exec-out cat "/data/data/$PACKAGE/cache/exports/vinylbase_sammlung.csv" \
            > "$EV/upgrade-prefs/baseline-export.csv" 2>/dev/null || true
          grep -q "TestKuenstler1EDITIERT" "$EV/upgrade-prefs/baseline-export.csv" \
            && grep -q "TestAlbumZwei" "$EV/upgrade-prefs/baseline-export.csv" \
            || { log "Export-CSV enthält erwartete Inhalte nicht"; exit 52; }
          log "Export-Content verifiziert (echte Cache-CSV mit geändertem Wert)"

          # ---------- 7) IMPORT-VORBEREITUNG ----------
          {
            printf 'ID,Künstler,Album,Jahr,Genre,Zustand,Format,Geschwindigkeit,Label,Notizen,Katalognummer\n'
            printf '"import-id-001","ImportKuenstler","ImportAlbumTest","1999","Rock","Mint","12"""" LP","33 ⅓ RPM","TestLabel","Importzeile","X-001"\n'
          } > /tmp/vinylbase-import.csv
          "$ADB" push /tmp/vinylbase-import.csv /sdcard/Download/vinylbase-import.csv >/dev/null 2>&1 \
            || { log "CSV-Push fehlgeschlagen"; exit 53; }
          log "Import-CSV bereit in /sdcard/Download"

          # ================= 8) IN-PLACE-UPGRADE (kein uninstall) =================
          log "Kandidaten-Upgrade (adb install -r): $CANDIDATE_APK"
          OUT=$("$ADB" install -r "$WORK_ART/$CANDIDATE_APK" 2>&1)
          echo "$OUT" | grep -qi "success" || { log "Kandidat fehlgeschlagen: $OUT"; exit 34; }
          echo "UPGRADE_INSTALL_OK=1" >> "$GITHUB_ENV"
          log "Upgrade installiert (in-place)"

          # ---------- 9) POST-UPGRADE-ASSERTIONS ----------
          "$ADB" logcat -c >/dev/null 2>&1 || true
          cold_start "candidate-1"
          dump_ui || { log "Dump nach Upgrade fehlgeschlagen"; exit 60; }

          if ui_contains "onboarding_skip"; then
            log "FAIL: Onboarding nach Upgrade sichtbar (onboarding_done ging verloren)"
            exit 60
          fi
          log "PASS: Onboarding nach Upgrade nicht sichtbar"

          MISS=0
          for n in "TestKuenstler1EDITIERT" "TestAlbumZwei" "TestAlbumDrei" "Kind of Blue" "Autobahn" "Discovery"; do
            ui_contains "$n" || { log "FAIL: '$n' nach Upgrade nicht in Liste"; MISS=1; }
          done
          [ "$MISS" = "0" ] || exit 60
          log "PASS: alle 6 Datensätze nach Upgrade gerendert"

          tap_ui "search_input" 6 || { log "Suchfeld nicht gefunden"; exit 61; }
          "$ADB" shell input text "TestAlbumZwei" >/dev/null 2>&1
          sleep 3
          dump_ui || { log "Dump nach Suche fehlgeschlagen"; exit 61; }
          ui_contains "TestKuenstler2" || { log "FAIL: Suche liefert Record 2 nicht"; exit 61; }
          if ui_contains "TestAlbumDrei"; then
            log "FAIL: Suche filtert nicht (Record 3 noch sichtbar)"; exit 61
          fi
          log "PASS: Suche filtert korrekt nach Upgrade"
          for k in $(seq 1 20); do "$ADB" shell input keyevent 67 >/dev/null 2>&1; done
          "$ADB" shell input keyevent 111 >/dev/null 2>&1

          tap_ui "btn_import_csv" 5 || { log "Import-Button nicht gefunden"; exit 62; }
          sleep 5
          tap_ui "vinylbase-import.csv" 8 || { log "Import-Datei im SAF-Picker nicht gefunden"; exit 62; }
          sleep 5
          cold_start "candidate-2"
          "$ADB" exec-out cat "/data/data/$PACKAGE/shared_prefs/vinylbase_prefs.xml" \
            > "$EV/upgrade-prefs/after-import-prefs.xml" 2>/dev/null || true
          grep -q "ImportKuenstler" "$EV/upgrade-prefs/after-import-prefs.xml" \
            || { log "FAIL: importierter Record nicht im Bestand"; exit 62; }
          log "PASS: CSV-Import über echte SAF-Auswahl erfolgreich"

          read_prefs "$EV/upgrade-prefs/after-prefs.xml" || { log "After-Prefs nicht lesbar"; exit 63; }
          grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
            "$EV/upgrade-prefs/after-prefs.xml" | sort > "$EV/upgrade-prefs/after-ids.txt"
          if diff -u "$EV/upgrade-prefs/baseline-ids.txt" "$EV/upgrade-prefs/after-ids.txt" \
              > "$EV/upgrade-prefs/diff-ids.txt" 2>/dev/null; then
            log "PASS: Record-IDs byte-genau erhalten"
          else
            log "FAIL: Record-IDs verändert"
            exit 63
          fi
          grep -q "TestKuenstler1EDITIERT" "$EV/upgrade-prefs/after-prefs.xml" \
            || { log "FAIL: geänderter Wert nach Upgrade verloren"; exit 63; }
          cold_start "candidate-3"
          dump_ui || { log "Dump nach Kaltstart fehlgeschlagen"; exit 64; }
          ui_contains "TestAlbumZwei" || { log "FAIL: Daten nach Kaltstart verloren"; exit 64; }
          log "PASS: Datenbestand überlebt Kaltstart nach Upgrade"

          # ---------- 10) Screenshot + Crash-Scan ----------
          for TRY in 1 2 3; do
            if with_timeout 45 "$ADB" exec-out screencap -p > "$EV/screenshots/upgrade-foreground.png" 2>/dev/null; then
              [ -s "$EV/screenshots/upgrade-foreground.png" ] && break
            fi
            sleep 4
          done
          with_timeout 90 "$ADB" logcat -d -v threadtime -t 3000 > "$EV/logcat/full-logcat.txt" 2>/dev/null || true
          APP_CRASHES=$(grep -cE "am_crash.*${PACKAGE}" "$EV/logcat/full-logcat.txt" 2>/dev/null || echo 0)
          OTHER_FATALS=$(grep "FATAL EXCEPTION" "$EV/logcat/full-logcat.txt" 2>/dev/null | grep -cv "uiautomator" || echo 0)
          CRASH_COUNT=$(( ${APP_CRASHES:-0} + ${OTHER_FATALS:-0} ))
          echo "CRASH_COUNT=$CRASH_COUNT" >> "$GITHUB_ENV"
          log "Crash-Einträge: $CRASH_COUNT"
          [ "$CRASH_COUNT" = "0" ] || { log "FAIL: App-Crash nach Upgrade"; exit 65; }

          echo "TESTS_PASSED=1" >> "$GITHUB_ENV"
          echo "TESTS_FAILED=0" >> "$GITHUB_ENV"
          log "VinylBase-Upgrade-Test v2 (UI-Assertions) abgeschlossen"
          exit 0

      - name: Verdict
        if: always()
        run: |
          EV="${RUNNER_TEMP:-/tmp}/nectar-evidence"
          if [ -z "${DEVICE_API:-}" ]; then
            VERDICT=INFRA_FAIL; BL="Emulator nicht bereit"
          elif [ "${BASELINE_INSTALL_OK:-0}" != "1" ]; then
            VERDICT=INFRA_FAIL; BL="Baseline-APK nicht installiert"
          elif [ "${SEED_OK:-0}" != "1" ]; then
            VERDICT=INFRA_FAIL; BL="Onboarding/Seed-Phase fehlgeschlagen (siehe Log-Schritt 'Upgrade-Test mit UI-Assertions')"
          elif [ "${UPGRADE_INSTALL_OK:-0}" != "1" ]; then
            VERDICT=FAIL; BL="In-Place-Upgrade-Install fehlgeschlagen (Signaturkompatibilität?)"
          elif [ ! -s "$EV/upgrade-prefs/after-prefs.xml" ]; then
            VERDICT=FAIL; BL="Post-Upgrade-Assertions nicht abgeschlossen (siehe Log-Schritt 'Upgrade-Test mit UI-Assertions')"
          else
            VERDICT=PASS; BL=""
          fi
          printf 'VERDICT=%s\nBLOCKER=%s\n' "$VERDICT" "$BL"
          IDSB=$(wc -l < "$EV/upgrade-prefs/baseline-ids.txt" 2>/dev/null | tr -d ' ')
          IDSA=$(wc -l < "$EV/upgrade-prefs/after-ids.txt" 2>/dev/null | tr -d ' ')
          EXPC=0; grep -q "TestKuenstler1EDITIERT" "$EV/upgrade-prefs/baseline-export.csv" 2>/dev/null && EXPC=1
          IMPC=0; grep -q "ImportKuenstler" "$EV/upgrade-prefs/after-import-prefs.xml" 2>/dev/null && IMPC=1
          {
            printf '{\n'
            printf '  "schema_version": 2,\n'
            printf '  "request_id": "%s",\n' "$REQUEST_ID"
            printf '  "app": "%s",\n' "$APP_ID"
            printf '  "package": "%s",\n' "$PACKAGE"
            printf '  "commit_sha": "%s",\n' "$COMMIT_SHA"
            printf '  "version_name": "%s",\n' "$VERSION_NAME"
            printf '  "version_code": "%s",\n' "$VERSION_CODE"
            printf '  "mode": "upgrade-vinylbase-v2-ui-assertions",\n'
            printf '  "baseline_apk": "%s",\n' "$BASELINE_APK"
            printf '  "candidate_apk": "%s",\n' "$CANDIDATE_APK"
            printf '  "verdict": "%s",\n' "$VERDICT"
            printf '  "blocker": "%s",\n' "$BL"
            printf '  "ids_baseline": "%s",\n' "${IDSB:-0}"
            printf '  "ids_after": "%s",\n' "${IDSA:-0}"
            printf '  "export_content_check": "%s",\n' "$EXPC"
            printf '  "import_prefs_check": "%s",\n' "$IMPC"
            printf '  "ui_assertions": ["onboarding-completed-pre-upgrade", "onboarding-not-shown-post", "all-6-records-rendered", "search-filters", "edited-value-persisted", "saf-import-ok", "cold-start-survives", "zero-app-crashes"]\n'
            printf '}\n'
          } > "$EV/result.json"
          cat "$EV/result.json"
          [ "$VERDICT" = "PASS" ] || exit 1

      - name: Evidence hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinylbase-upgrade-evidence-v2-${{ inputs.request_id }}
          path: ${{ runner.temp }}/nectar-evidence
          if-no-files-found: warn
