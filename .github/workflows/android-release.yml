name: android-release

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'UUID der Anfrage'
        required: true
        type: string
      app:
        description: 'App-Kennung'
        required: true
        type: string
      package:
        description: 'Android-Paketname'
        required: true
        type: string
      build_id:
        description: 'Opake UUID des Artefakts'
        required: true
        type: string
      commit_sha:
        description: 'Commit-SHA des privaten App-Repositorys'
        required: true
        type: string
      artifact_name:
        description: 'Artefaktname (.apk oder .aab)'
        required: true
        type: string
      artifact_sha256:
        description: 'Erwartete SHA256-Pruefsumme'
        required: false
        type: string
      version_name:
        description: 'Versionsname'
        required: true
        type: string
      version_code:
        description: 'Versionscode'
        required: true
        type: string
      test_activity:
        description: 'Launcher-Aktivitaet'
        required: false
        type: string
      release_candidate:
        description: 'Release-Kandidaten-Kennung'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REQUEST_ID: ${{ inputs.request_id }}
  APP_ID: ${{ inputs.app }}
  PACKAGE: ${{ inputs.package }}
  COMMIT_SHA: ${{ inputs.commit_sha }}
  ARTIFACT_NAME: ${{ inputs.artifact_name }}
  ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
  VERSION_NAME: ${{ inputs.version_name }}
  VERSION_CODE: ${{ inputs.version_code }}
  MODE: release

jobs:
  release:
    name: Release-Gatter
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Artefakt holen
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: ./scripts/fetch-artifact.sh

      - name: Artefakt-Typ pruefen
        run: |
          case "$ARTIFACT_NAME" in
            *.aab) echo "AAB erkannt - signiertes Release-Artefakt" ;;
            *.apk)
              echo "APK erkannt - ein Debug-Artefakt ist KEIN Release-Nachweis"
              echo "DEBUG_ARTIFACT=1" >> "$GITHUB_ENV"
              ;;
            *) echo "FEHLGESCHLAGEN: unerwartete Artefaktendung"; exit 1 ;;
          esac

      - name: Debug- und Test-Assets suchen
        run: |
          apk="$ARTIFACT_PATH"
          [ -f "$apk" ] || { echo "FEHLGESCHLAGEN: Artefakt fehlt"; exit 1; }
          if unzip -l "$apk" 2>/dev/null | grep -qiE "androidTest|test/runner"; then
            echo "GEFUNDEN: Test-Bundle im Artefakt" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ASSETS_FOUND=Test-Bundle" >> "$GITHUB_ENV"
          else
            echo "Keine offensichtlichen Test-Assets" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Emulator booten
        env:
          TARGET_API: '34'
        run: ./scripts/boot-emulator.sh

      - name: Smoke auf Phone
        run: |
          if [ -z "${{ inputs.test_activity }}" ]; then
            echo "TEST_ACTIVITY=${PACKAGE}/.MainActivity" >> "$GITHUB_ENV"
          else
            echo "TEST_ACTIVITY=${{ inputs.test_activity }}" >> "$GITHUB_ENV"
          fi
          ./scripts/run-smoke.sh
          cat "$RUNNER_TEMP/nectar-evidence/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Tablet und adaptives Layout
        run: |
          adb shell wm size 2560x1600 >/dev/null 2>&1 || true
          adb shell wm density 240 >/dev/null 2>&1 || true
          sleep 4
          adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
          adb shell am start -n "$TEST_ACTIVITY" >/dev/null 2>&1 || true
          sleep 6
          mkdir -p "$RUNNER_TEMP/nectar-evidence/screenshots"
          timeout 45 adb exec-out screencap -p > "$RUNNER_TEMP/nectar-evidence/screenshots/tablet-layout.png" 2>/dev/null || true

      - name: Offline-Pfad
        run: |
          adb shell svc wifi disable >/dev/null 2>&1 || true
          adb shell svc data disable >/dev/null 2>&1 || true
          adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
          adb shell am start -n "$TEST_ACTIVITY" >/dev/null 2>&1 || true
          sleep 6
          timeout 45 adb exec-out screencap -p > "$RUNNER_TEMP/nectar-evidence/screenshots/offline-path.png" 2>/dev/null || true
          adb shell svc wifi enable >/dev/null 2>&1 || true

      - name: Zustandswiederherstellung nach Prozessabbruch
        run: |
          adb shell am force-stop "$PACKAGE" >/dev/null 2>&1 || true
          sleep 3
          adb shell am start -n "$TEST_ACTIVITY" >/dev/null 2>&1 || true
          sleep 6
          RESUMED=$(adb shell dumpsys activity activities 2>/dev/null | grep -c "$PACKAGE" || true)
          echo "Wiederhergestellte Aktivitaeten: $RESUMED" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${RESUMED:-0}" -gt 0 ]; then
            echo "RESUME_OK=1" >> "$GITHUB_ENV"
          else
            echo "RESUME_OK=0" >> "$GITHUB_ENV"
          fi

      - name: Logcat sichern
        run: |
          mkdir -p "$RUNNER_TEMP/nectar-evidence/logcat"
          adb logcat -d -v threadtime -t 2000 > "$RUNNER_TEMP/nectar-evidence/logcat/release-logcat.txt" 2>/dev/null || true

      - name: Ergebnis normalisieren
        run: |
          MATRIX_JSON='[{"api":"34","label":"phone","acceleration":"software"},{"api":"34","label":"tablet","acceleration":"software"},{"api":"34","label":"offline","acceleration":"software"}]'
          export MATRIX_JSON
          BL=""
          if [ "${CRASH_COUNT:-0}" -gt 0 ]; then
            VERDICT=FAIL
            BL="Absturz oder ANR festgestellt"
          elif [ "${DEBUG_ARTIFACT:-0}" = "1" ]; then
            VERDICT=FAIL
            BL="Debug-Artefakt - kein Release-Nachweis"
          elif [ -n "${ASSETS_FOUND:-}" ]; then
            VERDICT=FAIL
            BL="Test-Assets im Artefakt: ${ASSETS_FOUND}"
          elif [ "${RESUME_OK:-0}" = "0" ]; then
            VERDICT=FAIL
            BL="Zustandswiederherstellung fehlgeschlagen"
          elif [ "${SCREEN_STATE:-unknown}" = "blank" ] || [ "${SHOT_OK:-0}" != "1" ]; then
            VERDICT=FAIL
            BL="Screenshot fehlt oder ist leer - kein Beleg fuer die Anzeige"
          else
            VERDICT=PASS
          fi
          export VERDICT
          if [ -n "$BL" ]; then export BLOCKER="$BL"; fi
          ./scripts/normalize-result.sh

      - name: Beleg sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nectar-release-${{ inputs.app }}-${{ inputs.release_candidate }}
          path: ${{ runner.temp }}/nectar-evidence
          retention-days: 7
          if-no-files-found: error

      - name: Wichtige Abgrenzung festhalten
        run: |
          {
            echo ""
            echo "### Abgrenzung"
            echo ""
            echo "**Runtime-PASS ist kein Release-PASS.** Offen bleiben: Signierung,"
            echo "Play-Richtlinien, Monetarisierung, Store-Eintrag, Datenschutzangabe"
            echo "und Play-Rueckmeldung."
            echo ""
            echo "Release-Kandidat: \`${{ inputs.release_candidate }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
