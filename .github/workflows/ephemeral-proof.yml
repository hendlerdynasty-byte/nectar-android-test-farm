name: ephemeral-proof
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: ephemeral-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check crypto dependency
        run: python3 -c 'import cryptography' || python3 -m pip install cryptography==50.0.0
      - name: Ephemeral private artifact runtime
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ephemeral-worker.py
