name: firebase-testlab

# Nur manueller Start. Firebase Test Lab ist der bevorzugte Runtime-Backend:
# Minuten statt der 20-60 min Software-Emulation. Der Android-Emulator
# (android-smoke/matrix/release) bleibt Rueckfallebene und Entwicklungsdiagnose.
#
# Authentifizierung: GitHub OIDC + Workload Identity Federation — KEIN
# langlebiger Service-Account-Key. Die Trust-Kette ist dreifach eingeschraenkt:
#   1. Provider-attributeCondition: nur dieses Repository, nur dieser Workflow,
#      nur refs/heads/master (keine PRs, keine Forks, keine fremden Repos).
#   2. SA-Bindung: roles/iam.workloadIdentityUser nur fuer principalSet mit
#      attribute.repository == hendlerdynasty-byte/nectar-android-test-farm.
#   3. Rollen des SA: cloudtestservice.testAdmin (Projekt) + storage.objectViewer
#      (Projekt) — kein Owner/Editor, keine Billing-Rolle.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'UUID der Anfrage'
        required: true
        type: string
      app:
        description: 'Kanonische App-Kennung'
        required: true
        type: string
      package:
        description: 'Android-Paketname'
        required: true
        type: string
      build_id:
        description: 'Opake UUID des Artefakts auf der privaten Bridge'
        required: true
        type: string
      commit_sha:
        description: 'Commit-SHA des privaten App-Repositorys'
        required: true
        type: string
      artifact_name:
        description: 'Dateiname des Artefakts'
        required: true
        type: string
      app_gcs_path:
        description: 'Optional: gs://-Pfad des APKs im Test-Lab-Eimer (für CI-Identitäten ohne Schreibzugriff). Identity-Bindung bleibt über Bridge + SHA-256.'
        required: false
        type: string
      artifact_sha256:
        description: 'Erwartete SHA256-Pruefsumme (fail closed)'
        required: false
        type: string
      version_name:
        description: 'Versionsname'
        required: false
        type: string
      version_code:
        description: 'Versionscode'
        required: false
        type: string
      mode:
        description: 'Testmodus'
        required: true
        type: string
        default: smoke
      timeout:
        description: 'Robo-Timeout je Gerät'
        required: false
        type: string
        default: '2m'

concurrency:
  group: testlab-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # für Workload Identity Federation (GitHub OIDC)

env:
  REQUEST_ID: ${{ inputs.request_id }}
  APP_ID: ${{ inputs.app }}
  PACKAGE: ${{ inputs.package }}
  COMMIT_SHA: ${{ inputs.commit_sha }}
  ARTIFACT_NAME: ${{ inputs.artifact_name }}
  ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
  VERSION_NAME: ${{ inputs.version_name }}
  VERSION_CODE: ${{ inputs.version_code }}
  MODE: ${{ inputs.mode }}
  ALLOW_PHYSICAL: '0'
  TL_TIMEOUT: ${{ inputs.timeout }}
  FIREBASE_PROJECT: nectar-android-testlab-01

jobs:
  testlab:
    name: Test Lab (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Artefakt von der privaten Bridge holen
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: ./scripts/fetch-artifact.sh

      - name: Google-Auth via Workload Identity Federation (kurzlebig, kein Key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: 'projects/205243761015/locations/global/workloadIdentityPools/github-farm-pool/providers/github-farm-provider'
          service_account: 'nectar-testlab-ci@nectar-android-testlab-01.iam.gserviceaccount.com'
          # Der Provider akzeptiert genau diese Audience; der STS-Tausch
          # vergleicht sie mit dem aud des angeforderten ID-Tokens.
          audience: 'https://github.com/hendlerdynasty-byte'

      - name: Identität protokollieren (ohne Secrets)
        run: |
          gcloud config get-value account
          gcloud config set project "${FIREBASE_PROJECT}"

      - name: Test Lab Matrix starten, warten, Belege holen
        run: |
          # ARTIFACT_PATH und ARTIFACT_SHA256 kommen aus fetch-artifact.sh
          # (nachgerechnete Pruefsumme, fail closed im Runner-Skript).
          export ARTIFACT="${ARTIFACT_PATH:?Artefakt wurde nicht geladen}"
          export APP_GCS_PATH="${{ inputs.app_gcs_path }}"
          export RESULTS_ROOT="$RUNNER_TEMP/nectar-evidence"
          export RESULTS_DIR_NAME="nectar-testlab-${APP_ID}-${MODE}-${REQUEST_ID}"
          python3 scripts/firebase_run_and_collect.py

      - name: Ergebnis als Beleg sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nectar-result-${{ inputs.app }}-${{ inputs.request_id }}
          path: ${{ runner.temp }}/nectar-evidence
          retention-days: 7
          # Vor dem Runner (z.B. Auth-Fehler) existiert keine Evidence —
          # Warnung statt Fehler; der Job bleibt durch den fehlgeschlagenen
          # Schritt bzw. das fail-closed Gate rot.
          if-no-files-found: warn

      - name: Ergebnis in die Zusammenfassung
        if: always()
        run: |
          {
            echo "### Test Lab: $APP_ID ($MODE)"
            echo ""
            cat "$RUNNER_TEMP/nectar-evidence/SUMMARY.md" 2>/dev/null || echo "(keine Zusammenfassung)"
          } >> "$GITHUB_STEP_SUMMARY"

      # FAIL-CLOSED: Der Workflow ist GRÜN nur bei kanonischem PASS.
      # FAIL / INFRA_FAIL / ZERO_COST_BLOCKED / WAITING_FOR_NO_COST_QUOTA
      # werden alle als Job-Fehler geführt — kontrolliert, ohne Quota-
      # Umgehung und ohne automatische Wiederholung über das Limit hinaus
      # (die Retry-Policy liegt im Runner-Skript, max. 1 INFRA-Retry).
      - name: Kanonisches Urteil erzwingen (fail closed)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "nectar-evidence", "result.json")
          verdict = None
          try:
              with open(path, encoding="utf-8") as fh:
                  verdict = json.load(fh).get("verdict")
          except Exception as e:
              print(f"Kein lesbares result.json ({e}) — gilt als INFRA_FAIL.")
              sys.exit(1)
          print(f"Kanonisches Verdikt: {verdict}")
          if verdict == "PASS":
              sys.exit(0)
          if verdict == "WAITING_FOR_NO_COST_QUOTA":
              print("Kontrollierter Nicht-PASS: kostenlose Quote erschöpft — keine kostenpflichtige Ausführung, kein Fallback.")
          sys.exit(1)
          PY
