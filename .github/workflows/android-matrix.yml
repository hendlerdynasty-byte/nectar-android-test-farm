name: android-matrix
on:
  workflow_dispatch:
    inputs:
      request_id: { description: 'UUID', required: true, type: string }
      app: { description: 'App-Kennung', required: true, type: string }
      package: { description: 'Paketname', required: true, type: string }
      build_id: { description: 'Einmalige Bridge-UUID', required: true, type: string }
      commit_sha: { description: 'Commit-SHA', required: true, type: string }
      artifact_name: { description: 'APK-Dateiname', required: true, type: string }
      artifact_sha256: { description: 'SHA256', required: true, type: string }
concurrency:
  group: matrix-${{ inputs.app }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  REQUEST_ID: ${{ inputs.request_id }}
  APP_ID: ${{ inputs.app }}
  PACKAGE: ${{ inputs.package }}
  COMMIT_SHA: ${{ inputs.commit_sha }}
  ARTIFACT_NAME: ${{ inputs.artifact_name }}
  ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
  MODE: standard
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Privates Artefakt einmalig holen
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: ./scripts/fetch-artifact.sh
      - name: Standard-Matrix ausfuehren
        run: ./scripts/run-standard-matrix.sh
      - name: Ergebnis normalisieren
        if: always()
        run: |
          if [ -z "${DEVICE_API:-}" ]; then VERDICT=INFRA_FAIL; BLOCKER='Emulator nicht bereit';
          elif [ "${MATRIX_OK:-0}" = 1 ]; then VERDICT=PASS;
          else VERDICT=FAIL; BLOCKER='Matrixprofil oder Beleg fehlgeschlagen'; fi
          export VERDICT BLOCKER
          ./scripts/normalize-result.sh
      - name: Belege sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nectar-matrix-${{ inputs.app }}-${{ inputs.request_id }}
          path: ${{ runner.temp }}/nectar-evidence
          retention-days: 7
          if-no-files-found: error
