name: android-smoke

# Nur manueller Start. Es gibt keinen push-, pull_request- oder
# schedule-Trigger: der Test-Farm laeuft ausschliesslich auf explizite
# Anforderung von Z Code, damit keine unbeabsichtigten Laeufe Kosten
# oder Ressourcen verbrauchen.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'UUID der Anfrage'
        required: true
        type: string
      app:
        description: 'Kanonische App-Kennung'
        required: true
        type: string
      package:
        description: 'Android-Paketname'
        required: true
        type: string
      build_id:
        description: 'Opake UUID des Artefakts auf der privaten Bridge'
        required: true
        type: string
      commit_sha:
        description: 'Commit-SHA des privaten App-Repositorys'
        required: true
        type: string
      artifact_name:
        description: 'Dateiname des Artefakts'
        required: true
        type: string
      artifact_sha256:
        description: 'Erwartete SHA256-Pruefsumme (fail closed)'
        required: false
        type: string
      version_name:
        description: 'Versionsname'
        required: false
        type: string
      version_code:
        description: 'Versionscode'
        required: false
        type: string
      target_api:
        description: 'Android-API-Level'
        required: false
        type: string

# GROSSZUGIG - Software-Emulation braucht lange zum Booten.
concurrency:
  group: smoke-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REQUEST_ID: ${{ inputs.request_id }}
  APP_ID: ${{ inputs.app }}
  PACKAGE: ${{ inputs.package }}
  COMMIT_SHA: ${{ inputs.commit_sha }}
  ARTIFACT_NAME: ${{ inputs.artifact_name }}
  ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
  VERSION_NAME: ${{ inputs.version_name }}
  VERSION_CODE: ${{ inputs.version_code }}
  MODE: smoke

jobs:
  smoke:
    name: Smoke auf API ${{ inputs.target_api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Kurzer Kontext protokollieren
        run: |
          echo "app=$APP_ID package=$PACKAGE commit=${COMMIT_SHA:0:12} mode=$MODE"
          echo "Kein Secret, keine URL und kein Artefaktinhalt wird ausgegeben."

      - name: Artefakt von der privaten Bridge holen
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: ./scripts/fetch-artifact.sh

      - name: Ziel-API aus Artefakt und Images bestimmen
        env:
          REQUESTED_API: ${{ inputs.target_api }}
        run: ./scripts/select-target-api.sh

      - name: Emulator booten
        run: ./scripts/boot-emulator.sh

      - name: Smoke-Test ausfuehren
        run: ./scripts/run-smoke.sh

      - name: Ergebnis normalisieren
        if: always()
        run: |
          # Verdikt: PASS nur, wenn die App wirklich gelaufen ist.
          # Ohne Vordergrund-Aktivitaet oder mit leerem Screenshot
          # waere das ein PASS ohne Beleg - das ist verboten.
          MATRIX_JSON="[{\"api\":\"${TARGET_API}\",\"tag\":\"google_apis\",\"arch\":\"x86_64\",\"acceleration\":\"${ACCELERATION:-unknown}\"}]"
          export MATRIX_JSON
          BL=""
          if [ -z "${DEVICE_API:-}" ]; then
            VERDICT=INFRA_FAIL
            BL="Emulator nicht bereit"
          elif [ "${INSTALL_OK:-0}" != "1" ]; then
            VERDICT=FAIL
            BL="APK wurde nicht installiert"
          elif [ "${CRASH_COUNT:-0}" -gt 0 ]; then
            VERDICT=FAIL
            BL="Absturz oder ANR festgestellt"
          elif [ "${SCREEN_STATE:-unknown}" = "blank" ]; then
            VERDICT=FAIL
            BL="Screenshot ist leer - App hat nichts angezeigt"
          elif [ "${SCREEN_STATE:-missing}" = "missing" ] || [ "${SHOT_OK:-0}" != "1" ]; then
            VERDICT=FAIL
            BL="Screenshot fehlt - kein Beleg fuer die Anzeige"
          else
            VERDICT=PASS
          fi
          export VERDICT
          # BL muss exportiert werden: $GITHUB_ENV wirkt erst fuer den
          # naechsten Schritt, nicht fuer das gerade laufende Skript.
          [ -n "$BL" ] && export BLOCKER="$BL"
          ./scripts/normalize-result.sh

      - name: Ergebnis als Beleg sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nectar-result-${{ inputs.app }}-${{ inputs.request_id }}
          path: ${{ runner.temp }}/nectar-evidence
          retention-days: 7
          if-no-files-found: error

      - name: Ergebnis in die Zusammenfassung
        if: always()
        run: |
          {
            echo "### Smoke: $APP_ID"
            echo ""
            cat "$RUNNER_TEMP/nectar-evidence/SUMMARY.md"
          } >> "$GITHUB_STEP_SUMMARY"
